    .sa[data-state=thinking] .sa-talk{opacity:.7}
    .sa-eg{margin:0;min-height:1.4em;font-size:.95rem;color:var(--ink-2,#555);transition:opacity .3s}

    .sa-type{display:flex;gap:var(--s2,8px);width:100%;max-width:420px}.sa-type input{flex:1;min-height:44px;padding:0 12px;border:1px solid var(--line,#ccc);border-radius:var(--r,12px);font:inherit;background:var(--bg,#fff);color:var(--ink,#111)}
    .sa-type button{min-height:44px;padding:0 16px;border-radius:var(--r,12px);border:1px solid var(--line,#ccc);background:var(--surface,#fff);color:var(--ink,#111);font:inherit;cursor:pointer}

   <button class="btn btn-quiet back" data-back type="button"></button>

function alertUser(){try{navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive)&&navigator.vibrate([300,120,300,120,300])}catch(e){}
 try{if(!AC)return;[880,660,880].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.28);o.stop(AC.currentTime+i*.28+.2)})}catch(e){}}
function cause(j,status){const s=((j&&(j.notice||j.error||j.detail))||'')+'';
 if(status===402||/credit/i.test(s))return t('credits');if(status===429||/rate.?limit|too many/i.test(s))return t('rate');return s?t('rate'):''}
function showNotice(m,k){const n=$('#notice');if(!m){n.hidden=true;return}n.className='msg msg-'+(k||'warn');n.innerHTML=ICON('info')+'<span>'+esc(m)+'</span>';n.hidden=false}
function play(u){const p=$('#player');p.src=u;p.play().catch(()=>{})}
function render(){
 const st=S.status||'idle';
 if(st==='asking'){manual=null;show('v-ask');const ml=S.question_text||'',en=S.question_en||'';
  $('#qBig').textContent=L==='ml'?ml:en;$('#qBig').lang=L;$('#qSmall').textContent=L==='ml'?en:ml;$('#qSmall').lang=L==='ml'?'en':'ml';
  $('#mic').disabled=!S.voice_available;if(!S.voice_available&&!rec)$('#hear').textContent=t('credits');
  if(prevStatus!=='asking')alertUser()}
 else if(st==='approved'){manual=null;show('v-wait');if(S.webhook_ok===false){$('#waitT').textContent=t('notSent');$('#waitS').textContent=''}else{$('#waitT').textContent=t('waitT');$('#waitS').textContent=t('waitS')}}
 else if(st==='recovered'){manual=null;show('v-done');$('#doneT').textContent=t('doneT');$('#doneS').textContent=t('doneS')}
 else if(st==='declined'){manual=null;show('v-done');$('#doneT').textContent=t('declT');$('#doneS').textContent=''}
 else if(manual==='walk')show('v-walk');else if(manual==='crowd')show('v-crowd');else if(manual==='qa')show('v-qa');else show('v-calm');
 prevStatus=st;
 const f=[['Problem',S.summary],['Cause',S.root_cause],['Proposed fix',S.proposed_fix]].filter(x=>x[1]);
 $('#foundBody').innerHTML=f.map(([k,v])=>`<div><b>${k}</b><span lang="en">${esc(v)}</span></div>`).join('');
 const tl=S.timeline||[],steps=S.steps||[];const done=s=>tl.find(x=>x.step===s);
 let lastDone=-1;steps.forEach((s,i)=>{if(done(s))lastDone=i});const active=st!=='idle'&&st!=='declined';
 $('#tl').innerHTML=steps.map((s,i)=>{const e=done(s);return `<li class="${e?'done':(active&&i===lastDone+1?'now':'')}"><span class="st" lang="en">${esc(s)}</span>${e?`<time>${fmt(e.t)}</time>`:''}</li>`}).join('');
 const Lt=S.latency||{};const ks=Object.keys(Lt).filter(k=>Lt[k]);
 $('#lat').textContent=ks.length?'Voice timing: '+ks.map(k=>k.replace('_ms','').replace('_',' ')+' '+Lt[k]+' ms').join(', '):'';
 if(st==='asking'&&S.has_audio&&playedQ!==S.event_id){playedQ=S.event_id;play('/api/volunteer/audio?kind=question&e='+encodeURIComponent(S.event_id))}
 if(st==='recovered'&&S.has_confirm_audio&&playedC!==S.event_id){playedC=S.event_id;play('/api/volunteer/audio?kind=confirm&e='+encodeURIComponent(S.event_id))}}
function sync(G){const box=$('#careNear');if(!box)return;const GN={};((G.queue||{}).gates||[]).forEach(g=>GN[g.id]=g.name);const items=[].concat((G.care||[]).map(c=>({k:c.category||'help',u:c.urgency,id:c.id,txt:c.summary_en||c.transcript||'',stop:c.stop_name||c.stop_id||'',who:c.assigned_to&&c.assigned_to.name})),(G.help||[]).map(h=>({k:h.kind||'help',txt:h.text||'',stop:h.stop||''})));
 const lines=[];if(G.assistant&&G.assistant.fallback_line)lines.push('<p class="small pill-note">'+esc(G.assistant.fallback_line)+'</p>');if(G.rush_line)lines.push('<p class="small pill-note">'+esc(G.rush_line)+'</p>');
 if(items.length)lines.push('<h3 class="care-h">'+(L==='ml'?'അടുത്തുള്ള സഹായ അഭ്യർത്ഥനകൾ':'Requests near you')+' <span class="num">'+items.length+'</span></h3><ul class="care-list">'+items.slice(-4).reverse().map(i=>'<li class="u-'+(i.u||'normal')+'">'+(i.id?'<span class="cid">'+esc(i.id)+'</span> ':'')+'<b>'+esc(GN[i.stop]||i.stop||'')+'</b> <span>'+esc(i.txt).slice(0,90)+'</span>'+(i.who?' <span class="who">'+esc(i.who)+'</span>':'')+'</li>').join('')+'</ul>');
 const html=lines.join('');if(box.dataset.h!==html){box.innerHTML=html;box.dataset.h=html;box.hidden=!html}}
async function poll(){
 try{const r=await fetch('/api/state?role=staff&uid=volunteer-desk&lang='+L);if(!r.ok)throw r.status;const G=await r.json();S=G.volunteer||{};lastOk=Date.now();sync(G);if($('#notice').dataset.k==='net'){showNotice(null);$('#notice').dataset.k=''}}
 catch(e){if(Date.now()-lastOk>8000){showNotice(t('net'),'bad');$('#notice').dataset.k='net'}return}
 render()}
/* recording: tap to start, ends by itself after silence (or tap again); level meter on the button */
async function record(btn,out,onblob){prime();
 if(rec){rec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder){out.textContent=t('nomic');return}
 let s;try{s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){out.textContent=(e&&e.name==='NotAllowedError')?t('blocked'):t('nomic');return}
 const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x));
 chunks=[];rec=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);
 let spoke=false,lv=0,t0=Date.now(),raf=0,an=null;const buf=new Uint8Array(512);
 try{const c=AC||new (window.AudioContext||window.webkitAudioContext)();an=c.createAnalyser();an.fftSize=512;c.createMediaStreamSource(s).connect(an)}catch(e){an=null}
 const tick=()=>{if(!rec)return;let v=0;if(an){an.getByteTimeDomainData(buf);let q=0;for(const x of buf){const d=(x-128)/128;q+=d*d}v=Math.sqrt(q/buf.length)}
  btn.style.setProperty('--lvl',Math.min(1,v*6).toFixed(2));const n=Date.now();if(v>.03){spoke=true;lv=n}
  if(an&&((spoke&&n-lv>1500)||n-t0>12000||(!spoke&&n-t0>6000))){rec.stop();return}raf=requestAnimationFrame(tick)};
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{cancelAnimationFrame(raf);s.getTracks().forEach(x=>x.stop());const type=(rec&&rec.mimeType)||mt||'audio/webm';const b=new Blob(chunks,{type});rec=null;btn.classList.remove('is-listening');btn.innerHTML=ICON('mic');btn.style.removeProperty('--lvl');
  if(an&&!spoke){out.textContent=t('blip');return}onblob(b,/mp4|aac/.test(type)?'m4a':'webm')};
 rec.start();btn.classList.add('is-listening');btn.innerHTML=ICON('stop');out.textContent=t('listen');if(an)raf=requestAnimationFrame(tick)}
async function sendReply(fd){
 $('#hear').innerHTML='<span class="dots"><i></i><i></i><i></i></span>';$('#yes').disabled=$('#no').disabled=true;
 let r,j={};try{r=await fetch('/api/volunteer/reply',{method:'POST',body:fd});j=await r.json().catch(()=>({}))}catch(e){$('#hear').textContent=t('net');$('#yes').disabled=$('#no').disabled=false;return}
 $('#yes').disabled=$('#no').disabled=false;
 if(!r.ok||j.notice){$('#hear').textContent=cause(j,r.status)||t('blip');poll();return}
 const said=j.transcript?t('heard')+': "'+j.transcript+'". ':'';
 $('#hear').textContent=j.decision==='unclear'?said+t('unclear'):said;poll()}
/* Yes needs a deliberate second press; No is one press */
$('#yes').onclick=()=>{prime();const b=$('#yes');if(!armed){armed=Date.now();b.textContent=t('yes2');b.classList.add('armed');setTimeout(()=>{armed=0;b.textContent=t('yes');b.classList.remove('armed')},4000);return}
 armed=0;b.classList.remove('armed');b.textContent=t('yes');const f=new FormData();f.append('text','yes');sendReply(f)};
$('#no').onclick=()=>{prime();const f=new FormData();f.append('text','no');sendReply(f)};
/* hands-free yes / no: one tap, then it listens, answers aloud, and stops once the answer is clear */
let vLive=null;
async function startLive(){
 const m=$('#mic'),h=$('#hear');
 const sess=new LiveSession({endpoint:'/api/volunteer/live-turn',uid:'volunteer',lang:L,greeting:false,nudgeAfterMs:9e5,endAfterMs:90000,audioEl:$('#player')});
 sess.on('state',st=>{m.classList.toggle('is-listening',st==='listening'||st==='hearing');h.textContent=st==='listening'||st==='hearing'?t('listen'):h.textContent});
 sess.on('level',v=>m.style.setProperty('--lvl',(+v).toFixed(2)));
 sess.on('caption',c=>{if(c.who==='you')h.textContent=t('heard')+': "'+c.text+'"'});
 sess.on('turn',()=>poll());
 sess.on('error',e=>{if(e&&e.code==='denied')h.textContent=t('blocked');else if(e&&e.code==='nomic')h.textContent=t('nomic')});
 sess.on('end',()=>{vLive=null;document.body.classList.remove('live');m.classList.remove('is-listening');m.style.removeProperty('--lvl');m.innerHTML=ICON('mic');poll()});
 vLive=sess;document.body.classList.add('live');await sess.start();
 if(sess.phase==='off'){vLive=null;document.body.classList.remove('live');return false}
 m.innerHTML=ICON('stop');return true}
$('#mic').onclick=async()=>{prime();
 if(vLive){vLive.stop();return}
 if(!rec&&window.LiveSession&&(window.AudioContext||window.webkitAudioContext)&&localStorage.noLive!=='1'){try{if(await startLive())return}catch(e){}}
 record($('#mic'),$('#hear'),(b,ext)=>{const f=new FormData();f.append('audio',b,'reply.'+ext);sendReply(f)})};
$('#goWalk').onclick=()=>{prime();manual='walk';$('#wres').hidden=true;$('#wout').textContent='';render()};
$('#goCrowd').onclick=()=>{prime();manual='crowd';$('#cout').textContent='';render()};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{manual=null;render()});
$('#goAsk').onclick=()=>{prime();manual='qa';render()};
if(window.StaffAsk)StaffAsk.init(document.getElementById('staff-ask'),{lang:()=>L,staffId:'volunteer'});
async function crowd(fd){const o=$('#cout');o.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
 let r,j={};try{r=await fetch('/api/volunteer/crowd-report',{method:'POST',body:fd});j=await r.json().catch(()=>({}))}catch(e){o.textContent=t('net');return}
 if(j.notice||!r.ok){o.textContent=cause(j,r.status)||t('blip');return}
 const rp=j.report||{};o.textContent=rp.error?rp.error:(rp.applied?t('updated')+': '+rp.gate+', '+rp.count+' '+t('waiting'):(rp.note||t('blip')))}
$('#cform').onsubmit=e=>{e.preventDefault();const v=$('#cr').value.trim();if(!v)return;const f=new FormData();f.append('text',v);crowd(f)};
$('#cmic').onclick=()=>record($('#cmic'),$('#cout'),(b,ext)=>{const f=new FormData();f.append('audio',b,'crowd.'+ext);crowd(f)});
/* walk-in: the pilgrim (or the volunteer for them) speaks; language detected from the speech; slot read back in that language */
let wAudio=null;
$('#wmic').onclick=()=>record($('#wmic'),$('#wout'),async(b,ext)=>{
 const f=new FormData();f.append('walkin','1');f.append('lang','auto');f.append('uid','walkin-desk');f.append('audio',b,'walkin.'+ext);
 const o=$('#wout');o.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
 let r,j={};try{r=await fetch('/api/directions',{method:'POST',body:f});j=await r.json().catch(()=>({}))}catch(e){o.textContent=t('net');return}
 if(!r.ok||(j.notice&&!j.transcript)){o.textContent=cause(j,r.status)||t('blip');return}
 if(!j.transcript){o.textContent=t('blip');return}
 o.textContent=t('heard')+': "'+j.transcript+'"';
 $('#wres').hidden=false;const sl=j.slot||{};const tm=String(sl.label||'').match(/\d{1,2}:\d{2}/g)||[];$('#wgate').textContent=[sl.gate?t('gate')+': '+sl.gate:'',tm[1]?tm[0]+' - '+tm[1]:''].filter(Boolean).join('  ·  ');$('#wtime').textContent=tm[0]||sl.label||'';$('#wsay').textContent=j.reply_text||'';$('#wsay').lang=j.lang||'en';
 wAudio=j.audio_base64?'data:audio/wav;base64,'+j.audio_base64:null;$('#wplay').hidden=!wAudio;if(wAudio)play(wAudio)});
$('#wplay').onclick=()=>wAudio&&play(wAudio);
let OV=null;
function ovText(){const e=$('#ovT');if(e)e.innerHTML=esc((SiteMap.STR[L]||SiteMap.STR.en).staffH)+'<svg class="chev" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function initOv(){if(!window.SiteMap)return;OV=SiteMap.create($('#ovMap'),{uid:'volunteer-desk',lang:()=>L,compact:true,staff:true,
 onReport:async s=>{const f=new FormData();f.append('text',s.name+', many people waiting');try{await fetch('/api/volunteer/crowd-report',{method:'POST',body:f})}catch(e){}}});
 $('#siteOv').addEventListener('toggle',()=>{if($('#siteOv').open){OV.start(5000)}});ovText()}
const _text=text;text=function(){_text();if(window.SiteMap){ovText();if(OV)OV.render()}};
text();initOv();if(new URLSearchParams(location.search).get('ov'))$('#siteOv').open=true;poll();setInterval(poll,1500);
</script>
