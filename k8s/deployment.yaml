apiVersion: apps/v1
kind: Deployment
metadata:
  name: darshan
  namespace: darshan
  labels: {app: darshan}
spec:
  replicas: 1
  selector:
    matchLabels: {app: darshan}
  template:
    metadata:
      labels: {app: darshan}
    spec:
      containers:
        - name: darshan
          image: darshan:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: darshan-secrets
          env:
            - name: HEAVY_MB
              value: "12"
            - name: HEAVY_HOLD_S
              value: "1.5"
            - name: RUSH_WORKERS
              value: "16"
            - name: RUSH_RAMP_S
              value: "3"
            - name: STATE_FILE
              value: /data/state.json
            - name: NUDGEBEE_CRASH_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: darshan-secrets
                  key: NUDGEBEE_CRASH_WEBHOOK
                  optional: true
            - name: NUDGEBEE_ASSISTANT_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: darshan-secrets
                  key: NUDGEBEE_ASSISTANT_WEBHOOK
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 224Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}   # demo only: lost on reschedule. Production uses Postgres (see README, "What we would do for real traffic")
