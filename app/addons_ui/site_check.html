<!-- Check a link or an offer. Collapsed by default. Include site_check.js after it, then AddonsSiteCheck.init(el, {uid}). -->
<details class="ad-card" id="ad-site" style="margin:8px 0;border:1px solid var(--line,#ccc);border-radius:12px;background:var(--card,#fff);color:var(--ink,#111)">
  <summary style="min-height:48px;display:flex;align-items:center;padding:0 14px;font-size:1.05rem;cursor:pointer">Someone offered a pass? Check a link or an offer</summary>
  <div style="padding:8px 14px 14px;display:grid;gap:10px">
    <label style="display:grid;gap:4px">Language
      <select data-ad="lang" style="min-height:48px;font-size:1rem">
        <option value="ml">Malayalam</option><option value="te">Telugu</option><option value="ta">Tamil</option>
        <option value="kn">Kannada</option><option value="hi">Hindi</option><option value="en">English</option>
      </select></label>
    <label style="display:grid;gap:4px">Paste the web address, or type what the person offered
      <textarea data-ad="text" rows="3" style="font-size:1rem;padding:8px" placeholder="for example: pay 500 for a quick darshan pass"></textarea></label>
    <button type="button" data-ad="go" style="min-height:56px;font-size:1.1rem;border-radius:12px;background:var(--accent,#7a3b00);color:#fff;border:0">Check</button>
    <div data-ad="status" role="status" aria-live="polite" style="min-height:1.4em"></div>
    <div data-ad="out" hidden style="display:grid;gap:8px">
      <div data-ad="badge" style="font-weight:700"></div>
      <div data-ad="reply" style="font-size:1.2rem"></div>
      <ul data-ad="reasons" style="margin:0;padding-left:1.2em"></ul>
      <button type="button" data-ad="play" style="min-height:48px;font-size:1rem">Play again</button>
      <small>This is a quick warning, not a guarantee. Always confirm on the official notice board.</small>
    </div>
  </div>
</details>
