<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darshan Rush: recovery graph</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="graph"><div class="wrap">
<div class="top"><div><h1>Booking recovery</h1><p class="sub" id="status">Waiting for numbers from /api/metrics-lite.</p></div><span class="sim">SIMULATED</span></div>
<div class="legendbig">
 <div style="color:#f2b25c"><span id="l-p95">-</span><small>slowest 5% of requests, ms</small></div>
 <div style="color:#f08aa6"><span id="l-err">-</span><small>errors</small></div>
 <div style="color:#7fd1b9"><span id="l-rps">-</span><small>requests per second</small></div>
 <div style="color:#f6ead9"><span id="l-mode">-</span><small>map mode</small></div>
</div>
<svg id="chart" viewBox="0 0 1400 780" role="img" aria-label="Recovery chart"></svg>
<p><button class="btn" id="reset">Clear chart</button></p>
<p class="sub">Local test cluster, simulated crowd. Dashed line: the moment the flags flipped to the lite map and staggered slots.</p>
</div>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
let D=JSON.parse(sessionStorage.gdata||'[]');const MAX=450;
const panels=[{k:'p95_ms',label:'p95 ms',c:'#f2b25c'},{k:'errors',label:'errors',c:'#f08aa6'},{k:'rps',label:'requests/s',c:'#7fd1b9'}];
function el(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;$('#chart').appendChild(e);return e}
function draw(){const svg=$('#chart');svg.innerHTML='';
 const L=150,R=1380,H=200,gap=40,top=10;
 if(D.length<2){el('text',{x:700,y:360,'text-anchor':'middle','font-size':34,fill:'#cdbfd8'},'No data yet. Press "Cause the rush" on the judge page.');return}
 const t0=D[0].t,t1=D[D.length-1].t,span=Math.max(t1-t0,10);const X=t=>L+(t-t0)/span*(R-L);
 panels.forEach((p,i)=>{const y0=top+i*(H+gap),vals=D.map(d=>+d[p.k]||0),mx=Math.max(...vals,p.k==='errors'?2:1)*1.15;const Y=v=>y0+H-v/mx*H;
  el('rect',{x:L,y:y0,width:R-L,height:H,fill:'none',stroke:'#4a3d61','stroke-width':1.5});
  [0,.5,1].forEach(f=>{el('text',{x:L-10,y:y0+H-f*H+7,'text-anchor':'end','font-size':22,fill:'#cdbfd8'},(mx*f<10?(mx*f).toFixed(f?1:0):Math.round(mx*f)));});
  el('text',{x:L-10,y:y0-0,'text-anchor':'end','font-size':0},'');
  el('text',{x:R-12,y:y0+34,'text-anchor':'end','font-size':26,fill:p.c,'font-weight':700},p.label);
  el('polyline',{points:D.map(d=>X(d.t)+','+Y(+d[p.k]||0)).join(' '),fill:'none',stroke:p.c,'stroke-width':4,'stroke-linejoin':'round'})});
 const fi=D.findIndex((d,i)=>i>0&&D[i-1].map_mode==='full'&&d.map_mode==='lite');
 if(fi>0){const x=X(D[fi].t);el('line',{x1:x,x2:x,y1:0,y2:3*H+2*gap+top,stroke:'#f6ead9','stroke-width':3,'stroke-dasharray':'10 8'});
  el('text',{x:Math.min(x+10,R-420),y:3*H+2*gap+top+36,'font-size':26,fill:'#f6ead9'},'Flags flipped: lite map, staggered slots')}
 const secs=Math.round(span);el('text',{x:L,y:3*H+2*gap+top+36,'font-size':22,fill:'#cdbfd8'},'0 s');
 el('text',{x:R,y:3*H+2*gap+top+36,'text-anchor':'end','font-size':22,fill:'#cdbfd8',opacity:fi>0?0:1},secs+' s')}
async function tick(){
 let m;try{const r=await fetch('/api/metrics-lite');if(!r.ok)throw 0;m=await r.json()}catch(e){$('#status').textContent='Metrics not reachable. Retrying.';return}
 D.push({t:Date.now()/1000,p95_ms:+m.p95_ms||0,errors:+m.errors||0,rps:+m.rps||0,map_mode:m.map_mode||''});if(D.length>MAX)D.shift();
 sessionStorage.gdata=JSON.stringify(D);
 $('#l-p95').textContent=Math.round(m.p95_ms||0);$('#l-err').textContent=m.errors??'-';$('#l-rps').textContent=(+m.rps||0).toFixed(1);$('#l-mode').textContent=m.map_mode||'-';
 $('#status').textContent='Live, every 2 seconds. Restarts: '+(m.restarts??'-');draw()}
$('#reset').onclick=()=>{D=[];sessionStorage.gdata='[]';draw()};
draw();tick();setInterval(tick,2000);
</script></body></html>
